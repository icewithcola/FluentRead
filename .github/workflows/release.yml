name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag to build and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build ZIPs and publish release
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.13-debian
      options: --user root
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install CI tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # git's HTTPS fetch needs a trust store. ca-certificates is only a
          # Suggests of git, so --no-install-recommends skips it and checkout
          # fails with "Problem with the SSL CA cert".
          apt-get install -y --no-install-recommends \
            ca-certificates \
            openssl \
            git \
            zip \
            gh
          update-ca-certificates

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Job runs as root in a container; the workspace is owned by the runner
      # user (uid 1001). Checkout's safe.directory does not persist into later
      # container steps, so git (and gh, which shells out to git) rejects the
      # repo as dubious. --system avoids HOME mismatches (/root vs /github/home).
      - name: Trust workspace for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag matches package version
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production ZIP
        run: |
          bun run build
          mkdir -p artifacts
          cd .output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/artifacts/FluentRead-$RELEASE_TAG-chrome.zip" .

      - name: Build debug ZIP
        run: |
          bun run build:debug
          cd .output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/artifacts/FluentRead-$RELEASE_TAG-chrome-debug.zip" .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.zip \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
